[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "FakherMSA"
version = "0.1.0"
description = "FFT tabanli (MAFFT mantigi) Coklu Dizi Hizalamasi (MSA) kutuphanesi"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "YOUR FULL NAME", email = "your.email@example.com" }
]
keywords = ["bioinformatics", "MSA", "MAFFT", "FFT", "sequence-alignment"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.20",
]

[project.urls]
Homepage = "https://github.com/YOUR_GITHUB_USERNAME/FakherMSA"
Repository = "https://github.com/YOUR_GITHUB_USERNAME/FakherMSA"

[project.scripts]
fakhermsa = "fakhermsa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
